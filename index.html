<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Blackjack card game">
  <title>Very Cool Blackjack</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/Game.js" defer></script>
</head>

<body>

  <div>DEALER:<span id="dealer-standing"></span></div>
  <div id="dealer-hand"></div>

  <div id="message"></div>
  <div id="current-pot"></div>

  <div>PLAYER: <span id="player-standing">0</span></div>
  <div id="player-hand"></div>

  <button id="stay-button">STAY</button>
  <button id="hit-button">HIT</button>

  <div id="betting-container">
    <input type="number" id="bet-input" value="100" min="10" max="1000">
    <button id="deal-button">Bet ($100)</button>
  </div>

  <div id="credits">Credits: $<span id="credits-amount">1000</span></div>
  <div id="pot">Pot: $<span>0</span></div>

</body>

</html>
